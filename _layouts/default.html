<!doctype html>
<html lang="{{ page.lang | default: site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  {% if page.layout == 'post' %}<link rel="stylesheet" href="{{ '/assets/css/syntax.css' | relative_url }}?v={{ site.time | date: '%s' }}">{% endif %}
  {% feed_meta %}
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>
  <div class="page">
    {% unless page.home %}
    <nav class="site-nav" aria-label="Main navigation">
      <a href="{{ '/' | relative_url }}">Haoze Chang</a>
      <span><a href="{{ '/#research' | relative_url }}">Publications</a> / <a href="{{ '/notes/' | relative_url }}"{% if page.url contains '/notes/' %} aria-current="{% if page.layout == 'post' %}true{% else %}page{% endif %}"{% endif %}>Notes</a></span>
    </nav>
    {% endunless %}
    <main id="content">{{ content }}</main>
    <footer class="site-footer">
      <a href="{{ '/' | relative_url }}">Haoze Chang</a> · Design inspired by <a href="https://jonbarron.info/">Jon Barron</a>
    </footer>
  </div>
</body>
</html>
